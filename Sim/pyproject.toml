[project]
name = "dain-sim"
version = "0.1.0"
description = "DAIN local cluster simulation, chaos testing and benchmarks"
requires-python = ">=3.12"
dependencies = ["dain-common"]

[tool.uv.sources]
# Shared protocol/math package, installed editable from the sibling directory.
dain-common = { path = "../Common", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dain_sim"]
