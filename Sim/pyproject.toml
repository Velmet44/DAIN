[project]
name = "dain-sim"
version = "0.1.0"
description = "DAIN local cluster simulation, chaos testing and benchmarks"
requires-python = ">=3.12"
dependencies = ["dain-common"]

[tool.uv.sources]
dain-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dain_sim"]
