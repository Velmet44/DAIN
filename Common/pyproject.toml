[project]
name = "dain-common"
version = "0.1.0"
description = "Shared protocol schemas, scoring and accounting math for DAIN"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dain_common"]
