[project]
name = "dain-node"
version = "1.1.0"
description = "DAIN compute-node agent: registration, heartbeats, model executors"
requires-python = ">=3.12"
dependencies = [
    "dain-common",
    "httpx>=0.27",
    "psutil>=5.9",
    "websockets>=13",
    # Inference runtime (S4). transformers is pinned exactly: the pipeline stage
    # runner uses Llama decoder-layer internals, verified by the parity tests.
    "torch>=2.5,<3",
    "transformers==4.46.3",
    "safetensors>=0.4",
    "gguf>=0.6",
    # TorchAO INT4 quantization (export pipeline, S22). Pinned to 0.10.x:
    # 0.10 supports Int4CPULayout (CPU dev/testing) and TensorCoreTiledLayout
    # (GPU inference). torchao >=0.18 v2 requires the mslk kernel shim for CPU
    # quantization, which is not yet widely available; re-evaluate when mslk
    # ships broadly or GPU-only export is acceptable for dev tests.
    "torchao>=0.10,<0.11",
]

[tool.uv.sources]
# Shared protocol/math package, installed editable from the sibling directory.
dain-common = { path = "../Common", editable = true }
# CPU-only torch wheels (the GPU pilot installs CUDA wheels on real nodes).
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    # Bundles the node agent into a self-contained Windows executable option.
    "pyinstaller>=6.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dain_node"]
