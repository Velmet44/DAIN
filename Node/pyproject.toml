[project]
name = "dain-node"
version = "0.1.0"
description = "DAIN compute-node agent: registration, heartbeats, model executors"
requires-python = ">=3.12"
dependencies = [
    "dain-common",
    "httpx>=0.27",
    "psutil>=5.9",
    "websockets>=13",
    # Inference runtime (S4). transformers is pinned exactly: the pipeline stage
    # runner uses Llama decoder-layer internals, verified by the parity tests.
    "torch>=2.5,<3",
    "transformers==4.46.3",
    "safetensors>=0.4",
]

[tool.uv.sources]
# Shared protocol/math package, installed editable from the sibling directory.
dain-common = { path = "../Common", editable = true }
# CPU-only torch wheels (the GPU pilot installs CUDA wheels on real nodes).
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dain_node"]
