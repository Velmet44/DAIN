name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Client/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    env:
      # Baked into the static bundle so the site opens pre-configured.
      # Set these to YOUR deployment before going live:
      #   VITE_API_URL  = public coordinator origin, must be https://
      #   VITE_API_KEY  = DAIN_API_KEY the coordinator runs with
      #                   (remember: a static site exposes it; prototype posture)
      #   VITE_MODEL_ID = model id served by the coordinator store
      VITE_API_URL: "http://127.0.0.1:8000"
      VITE_API_KEY: ""
      VITE_MODEL_ID: "dain-tiny-16L"
      VITE_DEFAULT_MAX_TOKENS: "64"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
