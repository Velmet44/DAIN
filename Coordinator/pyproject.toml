[project]
name = "dain-coordinator"
version = "0.1.0"
description = "DAIN coordinator: control-plane API, registry, scheduling, relay, ledger"
requires-python = ">=3.12"
dependencies = [
    "dain-common",
    "fastapi>=0.115",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30",
]

[tool.uv.sources]
dain-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dain_coordinator"]
