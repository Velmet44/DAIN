[project]
name = "dain"
version = "0.1.0"
description = "DAIN — Decentralized AI Inference Network (monorepo root)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
# The root is a workspace anchor only; members are the installable packages.
package = false
# Cache and venv live on different filesystems here; hardlinks are impossible.
link-mode = "copy"

[tool.uv.workspace]
members = ["Common", "Coordinator", "Node", "Sim"]

[tool.uv.sources]
dain-common = { workspace = true }
dain-coordinator = { workspace = true }
dain-node = { workspace = true }
dain-sim = { workspace = true }

[dependency-groups]
dev = [
    "dain-common",
    "dain-coordinator",
    "dain-node",
    "dain-sim",
    "pytest>=8.3",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["Tests"]
addopts = "-q"
